<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="vincta-download-purpose" content="design">
<meta name="vincta-design-wrap" content="iframe">
<meta name="vincta-design-width" content="800">
<meta name="vincta-design-height" content="600">
<meta name="vincta-content-width" content="800">
<meta name="vincta-content-height" content="600">
<title>hot_item_2</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
.vincta-design-root{
  width:100%;height:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-sizing:border-box;
}
.vincta-design-viewport{
  position:relative;
  overflow:hidden;
  flex-shrink:0;
  
}
.vincta-design-shell{
  position:absolute;left:0;top:0;
  width:800px;height:600px;
  transform-origin:0 0;
}

.vincta-design-shell>iframe{
  display:block;width:800px;height:600px;
  max-width:800px;max-height:600px;
  border:0;overflow:hidden;box-sizing:border-box;background:transparent;
}

</style>
</head>
<body>
<div class="vincta-design-root" id="vincta-design-root">
  <div class="vincta-design-viewport" id="vincta-design-viewport">
    <div class="vincta-design-shell" id="vincta-design-shell">

    </div>
  </div>
</div>
<script>
(function () {
  var DW = 800;
  var DH = 600;
  var root = document.getElementById('vincta-design-root');
  var viewport = document.getElementById('vincta-design-viewport');
  var shell = document.getElementById('vincta-design-shell');
  if (!root || !viewport || !shell || !(DW > 0) || !(DH > 0)) return;

  function fit() {
    var rw = root.clientWidth || 0;
    var rh = root.clientHeight || 0;
    var s = 1;
    if (rw > 0 && rh > 0) {
      s = Math.min(rw / DW, rh / DH);
    } else if (rw > 0) {
      s = rw / DW;
    } else if (rh > 0) {
      s = rh / DH;
    }
    if (!isFinite(s) || s <= 0) s = 1;
    viewport.style.width = (DW * s) + 'px';
    viewport.style.height = (DH * s) + 'px';
    shell.style.transform = 'scale(' + s + ')';
  }

  if (typeof ResizeObserver !== 'undefined') {
    try {
      new ResizeObserver(fit).observe(root);
    } catch (e) {}
  }
  window.addEventListener('resize', fit);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fit);
  } else {
    fit();
  }
})();
</script>
</body>
</html>
