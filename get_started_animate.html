<script>
(function(){
  var DESIGN_W = 300;
  var DESIGN_H = 100;
  function fitSurface(){
    var surface = document.getElementById('design-surface');
    if(!surface) return;
    var parent = surface.parentElement;
    var cw = parent.clientWidth;
    var ch = parent.clientHeight;
    if(cw <= 0 || ch <= 0) return;
    var s = Math.min(cw / DESIGN_W, ch / DESIGN_H);
    surface.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  function normalizeUrl(url){
    var u = String(url || '').trim();
    if(!u) return '';
    if(!/^(https?:\/\/|mailto:|tel:)/i.test(u)) u = 'https://' + u;
    return u;
  }
  function bindButtonLink(){
    var btn = document.getElementById('theBtn');
    var node = document.getElementById('vincta-template-params');
    var importedParams = {};
    try{ if(node &amp;&amp; node.textContent) importedParams = JSON.parse(node.textContent); }catch(_){ importedParams = {}; }
    if(!btn) return;
    btn.addEventListener('click', function(e){
      var url = normalizeUrl(importedParams.btnUrl);
      if(!url){ e.preventDefault(); return; }
      e.preventDefault();
      window.location.href = url;
    });
  }
  bindButtonLink();
  fitSurface();
  window.addEventListener('resize', fitSurface);
  window.addEventListener('load', fitSurface);
})();
</script>

<script>
(function () {
  var DW = 300;
  var DH = 100;
  var root = document.getElementById('vincta-design-root');
  var viewport = document.getElementById('vincta-design-viewport');
  var shell = document.getElementById('vincta-design-shell');
  if (!root || !viewport || !shell || !(DW > 0) || !(DH > 0)) return;

  function fit() {
    var rw = root.clientWidth || 0;
    var rh = root.clientHeight || 0;
    var s = 1;
    if (rw > 0 && rh > 0) {
      s = Math.min(rw / DW, rh / DH);
    } else if (rw > 0) {
      s = rw / DW;
    } else if (rh > 0) {
      s = rh / DH;
    }
    if (!isFinite(s) || s <= 0) s = 1;
    viewport.style.width = (DW * s) + 'px';
    viewport.style.height = (DH * s) + 'px';
    shell.style.transform = 'scale(' + s + ')';
  }

  if (typeof ResizeObserver !== 'undefined') {
    try {
      new ResizeObserver(fit).observe(root);
    } catch (e) {}
  }
  window.addEventListener('resize', fit);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fit);
  } else {
    fit();
  }
})();
</script>
